<!DOCTYPE html>
<html lang="en" class="" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blog — FATCullen</title>
    <script>document.documentElement.classList.remove('no-js');</script>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/blog/blog.css">
  </head>
  <body class="scrollable has-fixed-header">

    <header class="blog-header">
      <nav class="blog-header__nav">
        <a href="/blog/" class="blog-header__link" aria-current="page">Blog</a>
        <a href="/" class="blog-header__link">Portfolio</a>
      </nav>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle light and dark mode" aria-pressed="true">
        <span class="icon" aria-hidden="true" style="--icon-url: url('/images/icons/circle-half-stroke-solid-full.svg')"></span>
      </button>
    </header>

    <main class="blog-page">
      <h1>Blog</h1>

      <input type="search" id="blog-search" class="blog-search" placeholder="Search posts…" aria-label="Search posts by title or tag">

      <p id="blog-empty" class="blog-empty" hidden="">No posts match your search.</p>

      <ul class="post-list" id="post-list">
INSERT_BLOGS
      </ul>
    </main>

    <script type="module" src="/main.js" defer=""></script>
  </body>
</html>
