<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FATCullen</title>
  <script>document.documentElement.classList.remove('no-js');</script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <div id="bg-fallback" aria-hidden="true"></div>
  <div id="bg-root" aria-hidden="true"></div>

  <header id="site-header">
    <a href="/" class="icon-btn" id="home-btn" aria-label="Home">
      <span class="icon" aria-hidden="true" style="--icon-url: url('/images/icons/house-solid-full.svg')"></span>
    </a>

    <a href="/experience.html" class="icon-btn">
      Experience
    </a>

    <a href="/projects.html" class="icon-btn">
      Projects
    </a>

    <a href="/blog/" class="icon-btn">
      Blog
    </a>

    <button class="icon-btn" id="theme-toggle" aria-label="Toggle light and dark mode" aria-pressed="false" disabled>
      <span class="icon" aria-hidden="true" style="--icon-url: url('/images/icons/circle-half-stroke-solid-full.svg')"></span>
    </button>

    <div class="bg-control" id="bg-control">
      <div class="bg-control__label">
        <span class="bg-control__eyebrow">Current background</span>
        <span class="bg-control__name" id="bg-name">Default</span>
      </div>
      <button class="icon-btn" id="reroll-btn" aria-label="Change background animation" disabled>
        <span class="icon" aria-hidden="true" style="--icon-url: url('/images/icons/rotate-right-solid-full.svg')"></span>
      </button>
    </div>
  </header>

  <main class="card card--wide">
    <section class="page-section">
      <h2>Projects</h2>
INSERT_PROJECTS
    </section>
  </main>

  <script type="module" src="/main.js" defer></script>
</body>
</html>
